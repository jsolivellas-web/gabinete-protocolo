<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gabinete de Protocolo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fija tipo "carpeta de expediente" + área de trabajo; en móvil la navegación pasa a una tira horizontal. */
:root{
  --paper:#f5f3ee; --sheet:#ffffff; --ink:#24302f; --ink-2:#5f6b69; --line:#e8e3d9; --line-2:#d9d2c4;
  --accent:#3f6266; --accent-soft:#dfe9e6; --gold:#8a6a45; --gold-soft:#efe4d3; --sun:#f1e6d2;
  --navy:#4b6e71; --navy-ink:#ffffff; --sea-2:#5f8483; --sea-3:#7a9a96; --terra:#b48a6e; --sand:#ece6da; --sage:#e3ebe8;
  --ok:#2f6b4f; --ok-soft:#dfe9e3; --warn:#946116; --warn-soft:#f6ecd8; --bad:#a63a32; --bad-soft:#f6e1de;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
  --r:14px; --shadow:0 1px 2px rgba(36,48,47,.04), 0 6px 20px rgba(36,48,47,.05);
}
@media (prefers-color-scheme: dark){:root[data-theme="oscuro-auto"]{
  --paper:#131816; --sheet:#1a211f; --ink:#e4e9e6; --ink-2:#a0aca9; --line:#29322f; --line-2:#36413e;
  --accent:#8fb7b2; --accent-soft:#223a37; --gold:#d4b48a; --gold-soft:#342b20; --sun:#d9c9a8;
  --navy:#2c4547; --navy-ink:#e4e9e6; --sea-2:#3a5a5a; --sea-3:#4f7370; --terra:#c49a7f; --sand:#27261f; --sage:#1d2a27;
  --ok:#7cc29a; --ok-soft:#1b3127; --warn:#e0ad5f; --warn-soft:#382c16; --bad:#ec8a80; --bad-soft:#3a1f1c; --shadow:none; color-scheme:dark}}
:root[data-theme="oscuro"]{
  --paper:#131816; --sheet:#1a211f; --ink:#e4e9e6; --ink-2:#a0aca9; --line:#29322f; --line-2:#36413e;
  --accent:#8fb7b2; --accent-soft:#223a37; --gold:#d4b48a; --gold-soft:#342b20; --sun:#d9c9a8;
  --navy:#2c4547; --navy-ink:#e4e9e6; --sea-2:#3a5a5a; --sea-3:#4f7370; --terra:#c49a7f; --sand:#27261f; --sage:#1d2a27;
  --ok:#7cc29a; --ok-soft:#1b3127; --warn:#e0ad5f; --warn-soft:#382c16; --bad:#ec8a80; --bad-soft:#3a1f1c; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.prec-grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}
@media (max-width:1200px){.prec-grid{grid-template-columns:minmax(0,1fr)}}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--sheet) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap}
.brand-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.3rem;font-weight:600;line-height:1.15;color:var(--accent);margin:0}
.brand-sub{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.nav-list{display:flex;flex:1;min-width:0;flex-wrap:nowrap;gap:2px;align-items:center;overflow-x:auto;scrollbar-width:none}
.nav-list a[data-logout]{margin-left:auto;font-weight:500}
.subnav{flex-basis:100%;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-left:2px}
.subnav:empty{display:none}
.subnav a{padding:5px 12px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.subnav a:hover{color:var(--accent)}
.subnav a.on{background:var(--accent-soft);color:var(--accent)}
.nav-list a{color:var(--ink-2);text-decoration:none;padding:7px 14px;border-radius:999px;font-size:.84rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nav-list a:hover{background:var(--accent-soft);color:var(--accent)}
.nav-list a.on{background:var(--accent);color:#fff}
:root[data-theme="oscuro"] .nav-list a.on{color:#13201e}
@media (prefers-color-scheme: dark){:root[data-theme="oscuro-auto"] .nav-list a.on{color:#13201e}}
.nav-list .count{font-family:var(--f-mono);font-size:.7rem;opacity:.75}
.nav-group,.brand-sub,.nav-list .count{display:none!important}
.nav-group-x{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);opacity:.7;margin:0 4px 0 12px;font-weight:700}
.nav-group:first-child{margin-left:0}
.storage{font-size:.75rem;color:var(--ink-2);padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);max-width:1180px;margin:0 auto}
main{flex:1;padding-block:28px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600;line-height:1.2}
h1{font-size:2.2rem;font-weight:500;letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
.lede{color:var(--ink-2);max-width:68ch;margin:6px 0 0}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.card > * + *{margin-top:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--ink-2);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--sheet);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button,.btn{font:inherit;font-size:.86rem;font-weight:500;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--ink-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="oscuro"] button.primary{color:#13201e}
@media (prefers-color-scheme: dark){:root[data-theme="oscuro-auto"] button.primary{color:#13201e}}
button.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
button.ghost:hover{color:var(--ink);background:var(--paper)}
button.danger{color:var(--bad)}
button.small{padding:5px 12px;font-size:.78rem}
button:disabled{opacity:.5;cursor:default}
.ai-only{display:none!important}
.has-ai .ai-only{display:inline-flex!important}
.has-ai .no-ai{display:none!important}
.ai-badge{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold);padding:1px 6px;border-radius:3px;font-weight:600}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;background:var(--paper);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td input,td select{padding:5px 7px;font-size:.86rem;min-width:90px}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:2.1rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.75rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em}
.list-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-item:last-child{border-bottom:none}
.list-item .t{font-weight:600}
.empty{padding:26px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:var(--r)}
.check{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:.9rem}
.check input{width:auto;margin-top:4px}
.check.done span{text-decoration:line-through;color:var(--ink-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--ink-2);padding:8px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.doc{font-family:var(--f-display);font-size:1rem;line-height:1.65;white-space:pre-wrap;background:var(--sheet);border:1px solid var(--line);padding:28px;border-radius:var(--r);max-width:75ch}
.seat-svg{display:block;margin:0 auto}
.seat-svg .tbl{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.5}
.seat-svg .seat{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.seat-svg .seat.p1{fill:var(--accent);stroke:var(--accent)}
.seat-svg .num{fill:var(--ink);font:600 13px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.seat-svg .p1n{fill:var(--sheet)}
.seat-svg .lbl{fill:var(--ink);font:500 11px var(--f-body);text-anchor:middle}
.seat-svg .lbl2{fill:var(--ink-2);font:400 10px var(--f-body);text-anchor:middle}
.seat-svg .cap{fill:var(--ink-2);font:600 10px var(--f-body);letter-spacing:.1em;text-anchor:middle;text-transform:uppercase}
.seat-svg .flag{stroke:var(--ink-2);stroke-width:1}
.bar{height:10px;background:var(--paper);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--sea-2),var(--sea-3))}
:root[data-theme="oscuro"] .bar > i{background:var(--gold)}
@media (prefers-color-scheme: dark){:root[data-theme="oscuro-auto"] .bar > i{background:var(--gold)}}
.bar.ok > i{background:var(--ok)}.bar.warn > i{background:var(--warn)}.bar.bad > i{background:var(--bad)}
.bar-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:.86rem}
.scheme{border-left:3px solid var(--accent);padding-left:16px}
.scheme dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;margin:0}
.scheme dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;padding-top:2px}
.scheme dd{margin:0}
.order-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.order-list li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.order-list .n{font-family:var(--f-mono);font-weight:600;color:var(--accent);text-align:center}
.trat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.trat{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.trat .tt{font-family:var(--f-display);font-size:1.15rem;color:var(--accent);font-weight:600}
.trat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--sheet);cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-size:.88rem;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,24,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--sheet);border-radius:var(--r);max-width:720px;width:100%;max-height:85vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal textarea{min-height:300px;font-family:var(--f-mono);font-size:.82rem}
.sep{height:1px;background:var(--line);border:0;margin:4px 0}
.hint{font-size:.8rem;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.prop-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.total-box{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-variant-numeric:tabular-nums}
.total-box .big{font-family:var(--f-display);font-size:1.6rem;font-weight:600}
.acuerdo-row{grid-template-columns:minmax(0,3fr) repeat(3,minmax(60px,.6fr)) minmax(0,1fr) auto;align-items:end}
@media (max-width:700px){.acuerdo-row{grid-template-columns:repeat(3,minmax(0,1fr))}.acuerdo-row > label:first-child{grid-column:1/-1}}
.res-grid{grid-template-columns:minmax(0,1fr) minmax(0,3fr);align-items:center}
@media (max-width:700px){.res-grid{grid-template-columns:minmax(0,1fr)}}
.img-field{display:flex;flex-direction:column;gap:6px}
.f-lbl{font-size:.78rem;color:var(--ink-2);font-weight:500}
.img-prev{width:120px;height:72px;border:1px dashed var(--line-2);border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:var(--paper);overflow:hidden}
.img-prev img{max-width:100%;max-height:100%;object-fit:contain}
label.btn{cursor:pointer}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pack-card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pack-img{position:relative;aspect-ratio:5/3;max-width:100%;overflow:hidden;background:var(--paper)}
.pack-img svg,.pack-img img{display:block;width:100%;height:100%;object-fit:cover}
.pack-tag{position:absolute;left:10px;bottom:10px;background:rgba(15,18,28,.72);color:#fff;font-size:.72rem;padding:3px 9px;border-radius:999px;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pack-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.inv-card{background:#fffdf8;color:#2a2622;border:1px solid #d9cfbf;box-shadow:0 8px 24px rgba(40,30,10,.12);padding:34px 30px;font-family:var(--f-display);font-size:1rem;line-height:1.5;max-width:520px;margin:0 auto;outline:1px solid #e9e0cf;outline-offset:-10px;overflow-wrap:anywhere}
.inv-card.c{text-align:center}
.inv-card.a6{max-width:360px}
.inv-card.a4{max-width:560px;font-size:.92rem}
.inv-logo{display:block;max-height:90px;max-width:60%;margin:0 auto 14px;object-fit:contain}
.inv-card.l .inv-logo{margin-left:0}
#pk-incl{display:flex;flex-direction:column;gap:4px}
.incl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.incl-row input[type=checkbox]{width:auto}
.incl-t{flex:1;min-width:160px;border-color:transparent;background:transparent;padding:5px 7px}
.incl-t:hover,.incl-t:focus{border-color:var(--line-2);background:var(--sheet)}
.incl-row.off .incl-t{text-decoration:line-through;color:var(--ink-2)}
.incl-desc{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.incl-desc input{width:100px}
.guide{border:1px solid var(--line);border-left:4px solid var(--sun);background:var(--sheet);border-radius:var(--r);padding:12px 14px}
.guide-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:.9rem}
.guide-top > div:first-child{min-width:0;flex:1}
.guide-pasos{margin:10px 0 0;padding-left:20px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.ex-banner{background:var(--gold-soft);color:var(--ink);border:1px solid var(--sun);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
.flujo{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.paso{flex:1 1 140px;flex-direction:column;align-items:flex-start;white-space:normal;text-align:left;padding:12px;gap:4px;min-width:0}
.paso-n{font-family:var(--f-mono);font-weight:600;color:var(--sheet);background:var(--accent);border-radius:999px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.flecha{align-self:center;color:var(--ink-2);font-size:1.2rem}
@media (max-width:700px){.flecha{display:none}}
.prov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.prov-card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.prov-card h3{font-size:1.05rem}
.prov-contact{display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.stars{color:var(--gold);letter-spacing:1px}
.sel{user-select:all}
.prov-sug{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:14px;grid-template-areas:"hero hero next next" "hero hero task succ" "bud bud prov conv" "quick quick quick conv"}
.bx{border-radius:24px;padding:20px;position:relative;overflow:hidden;min-width:0;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;white-space:normal;font-weight:400;color:var(--ink)}
button.bx:hover{border-color:var(--accent)}
.bx .num{font-family:var(--f-display);font-weight:500;letter-spacing:-.02em;line-height:1}
.bx .lbl{font-weight:600;font-size:.84rem;color:var(--ink-2)}
.hero{grid-area:hero;position:relative;overflow:hidden;border-radius:24px;padding:28px 28px 56px;color:#fff;background:linear-gradient(150deg,var(--navy) 0%,var(--sea-2) 60%,var(--sea-3) 100%);display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.hero .eyebrow{color:#ffffffbf}
.hero h1{color:#fff;font-size:2.5rem;font-weight:500;max-width:13ch;line-height:1.05;margin-top:6px}
.hero p{margin:12px 0 0;opacity:.9;max-width:40ch;line-height:1.5}
.hero .btns{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.hero button{border:1px solid #ffffff55;background:#ffffff1f;color:#fff}
.hero button.sun{background:var(--sun);border-color:var(--sun);color:#3a3226}
.hero .wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:42px;display:block;pointer-events:none}
.b-next{grid-area:next;padding:0;border:0;color:#fff;cursor:pointer;background:var(--navy)}
.b-next .img{position:absolute;inset:0;filter:saturate(.7)}
.b-next .img svg{width:100%;height:100%;display:block}
.b-next .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,32,31,.76),rgba(24,32,31,.06) 78%);padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.date-chip{align-self:flex-start;background:#fff;color:#3f6266;border-radius:14px;padding:6px 12px;text-align:center;font-family:var(--f-display);font-size:1.5rem;font-weight:600;line-height:1}
.date-chip small{display:block;font-family:var(--f-body);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#7a8583;margin-top:3px}
.b-next b{font-size:1.05rem;display:block;max-width:26ch}
.b-next .meta{font-size:.8rem;opacity:.88}
.b-next .bar{height:5px;border:0;background:#ffffff33;max-width:260px;margin-top:8px}
.b-next .bar > i{background:#f1e6d2!important}
.b-empty{grid-area:next;justify-content:center;align-items:flex-start;background:var(--sand);border-color:transparent}
.b-task{grid-area:task;background:var(--sand);border-color:transparent;cursor:pointer}
.b-task .num{font-size:3.6rem;color:var(--gold)}
.b-arrow{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;background:var(--sheet);color:var(--gold);display:grid;place-items:center}
.b-arrow svg,.qchip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.b-succ{grid-area:succ;align-items:center;justify-content:center;text-align:center}
.b-succ svg{width:84px;height:84px}
.b-bud{grid-area:bud;background:var(--sage);border-color:transparent;justify-content:space-between;gap:12px;cursor:pointer}
.b-bud .num{font-size:2.3rem;color:var(--accent)}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:3px;background:var(--sheet)}
.stack i{display:block;height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;font-weight:600;color:var(--ink-2);margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.b-prov{grid-area:prov;cursor:pointer}
.b-prov .num{font-size:2.8rem;color:var(--accent)}
.avs{display:flex;margin-top:auto;padding-top:8px}
.avs span{width:30px;height:30px;border-radius:50%;border:3px solid var(--sheet);margin-right:-8px;display:grid;place-items:center;font-size:.6rem;font-weight:800}
.b-conv{grid-area:conv;background:var(--gold-soft);border-color:transparent;gap:10px;cursor:pointer}
.calx{background:var(--sheet);border-radius:16px;text-align:center;padding:0 0 10px;width:88px;overflow:hidden;border:1px solid var(--line)}
.calx small{display:block;background:var(--terra);color:#fff;font-weight:800;font-size:.68rem;letter-spacing:.1em;padding:4px 0;margin-bottom:6px}
.calx .num{font-size:2.2rem;color:var(--gold)}
.b-conv b{font-size:.92rem}
.b-conv ol{margin:0;padding-left:18px;font-size:.8rem;line-height:1.55;color:var(--ink-2)}
.b-quick{grid-area:quick;flex-direction:row;flex-wrap:wrap;align-items:center;align-content:center;gap:8px}
.b-quick h2{width:100%;font-size:1.2rem;font-weight:500;margin-bottom:4px}
.qchip{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:999px;background:var(--paper);font-weight:600;font-size:.83rem;border:1px solid var(--line);color:var(--ink)}
.qchip span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.ev-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:12px}
.ev-card{background:var(--sheet);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;align-items:stretch;white-space:normal;font-weight:400;box-shadow:var(--shadow)}
.ev-card:hover{border-color:var(--accent)}
.ev-card .img{height:118px;position:relative;overflow:hidden;filter:saturate(.75)}
.ev-card .img svg,.ev-card .img img{width:100%;height:100%;display:block;object-fit:cover}
.ev-card .date-chip{position:absolute;left:10px;top:10px;font-size:1.05rem;padding:4px 10px}
.ev-card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.ev-card h3{font-family:var(--f-body);font-size:.95rem;font-weight:700}
.ev-card .bar{height:6px;border:0}

  .bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(140px,auto);grid-template-areas:"hero hero" "next next" "task succ" "bud bud" "prov conv" "quick quick"}

}
.verdict{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}
@media (max-width:900px){
  .brand{font-size:1.1rem}.brand-sub,.nav-group{display:none}
  .nav-list{flex-basis:100%;margin-inline:-4px}
  .nav-list .count{display:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}

<script>
/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const eur = n => new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR'}).format(n || 0);
const pct = n => (isFinite(n) ? Math.round(n) : 0) + '%';
const fdate = iso => { if (!iso) return ''; const d = new Date(iso + 'T00:00'); return isNaN(d) ? iso : d.toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'}); };
const today = () => new Date().toISOString().slice(0, 10);
const clone = o => JSON.parse(JSON.stringify(o));
function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v){ const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (a[k] ??= {}), o); t[last] = v; }
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2600); }
function modal(title, html, onMount){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-label="${esc(title)}"><div class="row between"><h3>${esc(title)}</h3><button class="ghost" data-close>Cerrar</button></div>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); });
  document.body.append(bg); onMount?.(bg); return bg;
}
function copyText(text, label = 'Texto copiado'){
  const fallback = () => modal('Copiar texto', `<p class="small muted">Selecciona el texto y cópialo (Ctrl+C).</p><textarea id="copy-area" readonly>${esc(text)}</textarea>`, m => { const ta = $('#copy-area', m); ta.focus(); ta.select(); });
  try { navigator.clipboard.writeText(text).then(() => toast(label), fallback); } catch { fallback(); }
}
async function download(filename, data){
  const dl = CAP.downloads, text = typeof data === 'string';
  if (!dl){ if (text) copyText(data, 'Contenido copiado (la descarga no está disponible aquí)'); else toast('La descarga de archivos solo funciona al abrir el programa en Claude.'); return; }
  try { await dl.save({filename, data}); }
  catch(e){ if (e?.code !== 'declined'){ if (text) copyText(data, 'No se pudo descargar; contenido copiado'); else toast('No se pudo descargar el archivo.'); } }
}
const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
const toCSV = (cols, rows) => '﻿' + [cols.map(c => csvCell(c.label)).join(';'), ...rows.map(r => cols.map(c => csvCell(r[c.key])).join(';'))].join('\n');

/* ============================================================
   CAPACIDADES DE CLAUDE (base de datos compartida, IA, descargas)
   ============================================================ */
const CAP = { db:null, sample:null, downloads:null };
async function initCaps(){
  if (!window.claude?.use) return;
  const [db, sample, downloads] = await Promise.all(['db','sample','downloads'].map(n => window.claude.use(n).catch(() => null)));
  CAP.sample = sample; CAP.downloads = downloads;
  document.body.classList.toggle('has-ai', !!sample);
  if (db) Store.attach(db);
  else Store.noteMode();
}
function aiError(e){
  const m = {not_granted:'No se ha permitido usar Claude en esta página.', rate_limited:'Demasiadas consultas seguidas. Espera un momento y vuelve a intentarlo.', refused:'Claude no ha podido procesar este texto. Prueba a reformularlo.', invalid_json:'La respuesta no tenía el formato esperado. Pulsa de nuevo para reintentar.', sampling_disabled:'Claude no está disponible para esta cuenta.', session_expired:'Tu sesión ha caducado: vuelve a iniciar sesión.', cancelled:'Consulta detenida.'};
  return m[e?.code] || 'No se pudo completar la consulta. Inténtalo de nuevo.';
}

/* ============================================================
   ALMACÉN: base de datos compartida del artefacto o, si no está, este navegador
   ============================================================ */
const COLS = ['eventos', 'actas', 'evaluaciones', 'contrataciones', 'fotos', 'convocatorias', 'proveedores'];
const Store = {
  mode:'local', db:null, data:{eventos:[], actas:[], evaluaciones:[], contrataciones:[], fotos:[], convocatorias:[], proveedores:[]},
  loadLocal(){ COLS.forEach(c => this.data[c] = lsGet('gp_' + c, [])); },
  noteMode(){
    $('#storage-note').innerHTML = this.mode === 'db'
      ? '<b>Guardado compartido.</b> Los datos se guardan en este artefacto y los ve cualquiera con quien lo compartas.'
      : '<b>Guardado local.</b> Los datos se guardan solo en este navegador. Usa «Exportar» para pasarlos a otro equipo.';
  },
  attach(db){
    this.db = db; this.mode = 'db'; this.noteMode();
    COLS.forEach(c => db.collection(c).onSnapshot(snap => {
      this.data[c] = snap.docs.map(d => ({...d.data(), id:d.id}));
      refreshLists();
    }, () => {}));
  },
  async save(col, obj){
    delete obj._ejemplo;
    obj.actualizado = new Date().toISOString();
    if (!obj.id) obj.id = uid();
    const plain = clone(obj);
    if (this.mode === 'db'){
      try { await this.db.collection(col).doc(obj.id).set(plain); }
      catch(e){ toast(e?.code === 'quota_exceeded' ? 'No queda espacio: borra registros antiguos.' : 'No se pudo guardar: ' + (e?.code === 'invalid_argument' ? 'no tienes permiso de edición.' : 'inténtalo de nuevo.')); return false; }
    } else {
      const arr = this.data[col]; const i = arr.findIndex(x => x.id === obj.id);
      if (i >= 0) arr[i] = plain; else arr.push(plain);
      lsSet('gp_' + col, arr);
    }
    if (this.mode !== 'db') refreshLists();
    return true;
  },
  async remove(col, id){
    if (this.mode === 'db'){ try { await this.db.collection(col).doc(id).delete(); } catch { toast('No se pudo borrar.'); } }
    else { this.data[col] = this.data[col].filter(x => x.id !== id); lsSet('gp_' + col, this.data[col]); refreshLists(); }
  },
  get(col, id){ return this.data[col].find(x => x.id === id); }
};

/* ============================================================
   DATOS DE REFERENCIA: TIPOS DE EVENTO
   ============================================================ */

  {id:'oficial', nombre:'Políticos y diplomáticos', protocolo:'Protocolo oficial / diplomático', tipos:['Mitin','Debate electoral','Noche electoral','Presentación de candidatura','Cumbre o reunión bilateral','Recepción diplomática','Visita de Estado','Presentación de cartas credenciales']},
  {id:'empresarial', nombre:'Corporativos y empresariales', protocolo:'Protocolo empresarial', tipos:['Congreso','Convención de empresa','Junta general de accionistas','Comité o consejo de dirección','Presentación o lanzamiento de producto','Rueda de prensa','Feria comercial / stand','Inauguración de sede','Aniversario de empresa','Jornada de puertas abiertas','Team building','Viaje de incentivos','Desayuno o almuerzo de trabajo','Networking','Seminario / taller / formación','Webinar o evento virtual','Evento híbrido','Firma de acuerdo comercial','Cena de empresa / Navidad','Visita de clientes o fábrica']},

  {id:'social', nombre:'Sociales y familiares', protocolo:'Protocolo social', tipos:['Boda civil','Boda religiosa','Pedida de mano','Despedida de soltero/a','Bautizo','Primera comunión','Cumpleaños','Aniversario de boda','Baby shower','Fiesta privada','Funeral o despedida','Reunión de antiguos alumnos']},
  {id:'cultural', nombre:'Culturales', protocolo:'Protocolo cultural', tipos:['Exposición','Concierto','Festival','Estreno / premiere','Presentación de libro','Desfile de moda','Obra de teatro','Visita guiada','Lectura o recital','Feria del libro / artesanía']},
  {id:'gala', nombre:'Galas y premios', protocolo:'Protocolo social / institucional', tipos:['Cena de gala','Entrega de premios','Gala benéfica / subasta','Cóctel o recepción','Baile de gala','Cena de homenaje']},
  {id:'oficial', nombre:'Religiosos', protocolo:'Protocolo religioso', tipos:['Misa solemne / Te Deum','Procesión','Toma de posesión eclesiástica','Romería','Celebración interreligiosa']},

];

  'Boda religiosa':['Expediente y cursillo prematrimonial','Reserva de la iglesia','Padrinos y testigos','Lecturas y música litúrgica','Arras y alianzas','Plano de mesas (mesa presidencial: novios, padrinos, padres)','Primer baile'],
  'Viaje de estudios':['Aprobación del consejo escolar','Recaudación y control de pagos','Comparar 3 presupuestos de agencia','Seguro de cancelación','Rooming list','Botiquín y medicación de alumnos'],

  oficial:['Megafonía y atril','Banderas y mástiles','Placa conmemorativa','Tarjetones y señalética','Personal de protocolo','Vino de honor'],
  empresarial:['Ponentes','Branding y photocall','Streaming','Regalo corporativo','Transporte de asistentes'],
  deportivo:['Trofeos y medallas','Dorsales y cronometraje','Arbitraje','Ambulancia y médico','Avituallamiento','Licencias y tasas'],
  social:['Banquete (precio por cubierto)','Fotógrafo y vídeo','Música','Flores','Vestuario','Invitaciones'],
  academico:['Transporte','Alojamiento','Manutención','Entradas y visitas','Seguro de viaje','Monitores o guías'],
  cultural:['Transporte de obra','Montaje expositivo','Seguro clavo a clavo','Catálogo','Honorarios artísticos'],
  gala:['Cubierto de gala','Trofeos y diplomas','Presentador','Actuación','Photocall y alfombra','Iluminación escénica']
};
const ALL_TYPES = CATS.flatMap(c => c.tipos.map(t => ({nombre:t, cat:c.id, grupo:c.nombre, protocolo:c.protocolo})));
const typeInfo = n => ALL_TYPES.find(t => t.nombre === n) || {nombre:n, cat:'general', grupo:'Otros', protocolo:'Protocolo social'};
function checklistFor(tipo){
  const ti = typeInfo(tipo);
  const items = [...(SPECIAL_CHECK[tipo] || []), ...(BASE_CHECK[ti.cat] || []), ...BASE_CHECK.general];
  return [...new Set(items)].map(t => ({t, ok:false}));
}

/* ============================================================
   DATOS DE REFERENCIA: PRECEDENCIAS
   Orientativo, basado en el RD 2099/1983 (arts. 10 y 12) y usos habituales.

const UI = { view:'panel', evento:null, acta:null, evaluacion:null, actaTab:'datos', evTab:'datos' };
// Menú principal: los apartados de Eventos y de Protocolo se agrupan y muestran una segunda fila
const MENU = [['panel','Panel'],['eventos','Eventos',['eventos','catalogo','invitaciones']],['packs','Packs'],['proveedores','Proveedores'],['convocatorias','Convocatorias'],['actas','Actas'],['protocolo','Protocolo',['noticias','precedencia','tratamientos']],['evaluacion','Evaluación'],['guia','Guía']];
function renderNav(){
  let h = '';
  const grupo = MENU.find(m => m[2] && m[2].includes(UI.view));
  MENU.forEach(([id, label, subs]) => {
    const on = subs ? subs.includes(UI.view) : UI.view === id;
    h += `<a href="#${subs ? subs[0] : id}" data-view="${subs ? subs[0] : id}" class="${on ? 'on' : ''}">${esc(label)}</a>`;
  });
  $('#subnav').innerHTML = grupo ? grupo[2].map(id => { const v = VIEWS.find(x => x.id === id); return `<a href="#${id}" data-view="${id}" class="${UI.view === id ? 'on' : ''}">${esc(v.label)}${v.count ? ` · ${v.count()}` : ''}</a>`; }).join('') : '';
  $('#nav').innerHTML = h;
}
function go(view){ UI.view = view; try { history.replaceState(null, '', '#' + view); } catch {} render(); window.scrollTo(0, 0); }
$('#subnav').addEventListener('click', e => { const a = e.target.closest('[data-view]'); if (a){ e.preventDefault(); go(a.dataset.view); } });
$('#nav').addEventListener('click', e => { const a = e.target.closest('[data-view]'); if (a){ e.preventDefault(); go(a.dataset.view); } });
function render(){
  renderNav();
  const v = $('#view'); v.onclick = null;
  v.onchange = null;
  ({panel:renderPanel, guia:renderGuia, eventos:renderEventos, catalogo:renderCatalogo, packs:renderPacks, proveedores:renderProveedores, convocatorias:renderConvocatorias, invitaciones:renderInvitaciones, actas:renderActas, noticias:renderNoticias, precedencia:renderPrecedencia, tratamientos:renderTratamientos, evaluacion:renderEvaluacion}[UI.view] || renderPanel)(v);
}
function refreshLists(){
  renderNav();
  if (UI.view === 'panel') renderPanel($('#view'));
  const map = {eventos:['#ev-list', evListHTML], actas:['#acta-list', actaListHTML], convocatorias:['#conv-list', convListHTML], evaluacion:['#eval-list', evalListHTML]};
  const m = map[UI.view]; if (m && $(m[0])) $(m[0]).innerHTML = m[1]();
  if (UI.view === 'proveedores' && $('#prov-out')) $('#prov-out').innerHTML = provVistaHTML();
  if (UI.view === 'packs' && $('#pack-grid')){ $('#pack-grid').innerHTML = packGridHTML($('#pack-q')?.value || ''); $('#contr-list').innerHTML = contrListHTML(); }
}

  const saludo = (hora < 14 ? 'Buenos días' : hora < 21 ? 'Buenas tardes' : 'Buenas noches') + (nombre ? ', ' + esc(nombre) : '');
  const dias = f => Math.round((new Date(f + 'T00:00') - new Date(now + 'T00:00')) / 864e5);

  ${(rows || []).map((r, i) => `<tr>${cols.map(c => {

    if (c.type === 'calc') return `<td class="num" data-calc="${k}">${c.calc(r)}</td>`;

function bindEditor(root, draft, opts = {}){
  root.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return;
    let v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (e.target.type === 'number') v = e.target.value === '' ? '' : num(e.target.value);
    setPath(draft, k, v); opts.onInput?.(k, v);
  });
  root.addEventListener('change', async e => {
    const k = e.target.dataset.k; if (k && e.target.tagName === 'SELECT') opts.onChange?.(k, e.target.value);
    const ik = e.target.dataset.img;
    if (ik && e.target.files?.[0]){ try { setPath(draft, ik, await compressImage(e.target.files[0])); opts.onRows?.(ik); } catch { toast('No se pudo leer la imagen. Prueba con un JPG o PNG.'); } }
  });
  root.addEventListener('click', e => {
    const di = e.target.closest('[data-img-del]'); if (di){ setPath(draft, di.dataset.imgDel, ''); opts.onRows?.(di.dataset.imgDel); return; }
    const a = e.target.closest('[data-add]'); const d = e.target.closest('[data-del]');
    if (a){ const arr = getPath(draft, a.dataset.add) || []; arr.push({}); setPath(draft, a.dataset.add, arr); opts.onRows?.(a.dataset.add); }
    if (d){ const p = d.dataset.del.split('.'); const i = +p.pop(); const key = p.join('.'); getPath(draft, key).splice(i, 1); opts.onRows?.(key); }
  });
}

  if (d.objetivos) L.push('', '## Objetivos', d.objetivos);

  if (d.escaleta.length) L.push('', '## Escaleta', ...d.escaleta.map(x => `- ${x.hora || '--:--'}  ${x.actividad || ''}${x.responsable ? ' · ' + x.responsable : ''}${x.lugar ? ' · ' + x.lugar : ''}`));
  if (d.tareas.length) L.push('', '## Tareas', ...d.tareas.map(x => `- [${x.estado === 'Hecha' ? 'x' : ' '}] ${x.tarea || ''} — ${x.responsable || 'sin asignar'}${x.fecha ? ' (antes del ' + fdate(x.fecha) + ')' : ''}`));
  if (d.invitados.length) L.push('', '## Invitados', ...d.invitados.map(x => `- ${x.tratamiento ? x.tratamiento + ' ' : ''}${x.nombre || ''}${x.cargo ? ', ' + x.cargo : ''} · ${x.rsvp || 'Pendiente'}`));
  if (d.proveedores.length) L.push('', '## Proveedores', ...d.proveedores.map(x => `- ${x.proveedor || ''}: ${x.servicio || ''} · ${eur(num(x.coste))} · ${x.estado || ''}`));
  const p = d.partidas.reduce((s, x) => s + num(x.previsto), 0);
  if (d.partidas.length) L.push('', `## Presupuesto previsto: ${eur(p)}`, ...d.partidas.filter(x => num(x.previsto) || num(x.real)).map(x => `- ${x.concepto}: ${eur(num(x.previsto))}${num(x.real) ? ' (real ' + eur(num(x.real)) + ')' : ''}`));
  const pend = d.checklist.filter(c => !c.ok);
  if (d.checklist.length) L.push('', `## Lista de control: ${d.checklist.length - pend.length}/${d.checklist.length} hecho`, ...pend.slice(0, 15).map(c => `- [ ] ${c.t}`));
  return L.join('\n');
}

function actaTotals(a){
  const lineas = []; (a.propuestas || []).forEach((p, i) => (p.partidas || []).forEach(x => lineas.push({prop:p.titulo || `Propuesta ${i + 1}`, aprobada:p.estado === 'Aprobada', ...x, imp:num(x.cantidad) * num(x.precio)})));

  return [`PRESUPUESTO · ${a.tipo} · ${fdate(a.fecha)}`, '', ...t.lineas.map(l => `${l.prop} — ${l.concepto}: ${num(l.cantidad)} × ${eur(num(l.precio))} = ${eur(l.imp)}`), '', `Base imponible: ${eur(t.base)}`, `Imprevistos (${a.imprevistos}%): ${eur(t.impr)}`, `IVA (${a.iva}%): ${eur(t.iva)}`, `TOTAL: ${eur(t.total)}`].join('\n');

function actaTexto(a){
  const lines = s => (s || '').split('\n').map(x => x.trim()).filter(Boolean);
  const od = lines(a.ordenDia);
  const L = [];
  L.push(`ACTA ${a.numero ? 'N.º ' + a.numero + ' ' : ''}DE ${a.tipo.toUpperCase()}`, a.entidad ? a.entidad.toUpperCase() : '', '');

function heuristicNews(text){
  const scores = TIPO_KEYS.map(([t, re]) => ({t, n:(text.match(new RegExp(re.source, 'gi')) || []).length})).filter(x => x.n).sort((a, b) => b.n - a.n);
  const found = []; const seen = new Set();
  // nombre justo detrás del cargo: «el alcalde de Sevilla, José Luis Sanz» · «el Rey Felipe VI»
  const nameRe = /^[\s,]*(?:[^,.;:()]{0,32},\s*)?([A-ZÁÉÍÓÚÑ][a-záéíóúñü]+(?:\s+(?:de\s+|del\s+|la\s+)?(?:[A-ZÁÉÍÓÚÑ][a-záéíóúñü]+|[IVX]+\b)){0,3})/;
  NEWS_PATTERNS.forEach(([re, label, rank]) => {
    const g = new RegExp(re.source, 'gi'); let m;
    while ((m = g.exec(text))){
      const after = text.slice(m.index + m[0].length, m.index + m[0].length + 90);
      const nm = after.match(nameRe);
      const ctx = text.slice(Math.max(0, m.index - 30), m.index + m[0].length + 60).replace(/\s+/g, ' ');
      const key = label + '|' + (nm ? nm[1] : '');
      if (seen.has(key) || (!nm && seen.has(label))) continue; seen.add(key); seen.add(label);
      found.push({orden:0, cargo:label, nombre:nm ? nm[1] : '', rank, contexto:'…' + ctx.trim() + '…'});
      if (found.length > 25) break;
    }
  });
  found.sort((a, b) => a.rank - b.rank).forEach((x, i) => x.orden = i + 1);
  const fecha = (text.match(/\b(\d{1,2} de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)( de \d{4})?)\b/i) || [])[1] || '';
  const lugar = (text.match(/\ben (el|la) ([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+(?: [\wáéíóúñ]+){0,4})/) || [])[0] || '';
  return {tipo_protocolo:scores[0]?.t || 'No determinado', otros_ambitos:scores.slice(1, 4).map(s => s.t), acto:'', fecha, lugar:lugar.replace(/^en /, ''), autoridades:found, basico:true};
}

function rankOf(p){
  if (P.ambito === 'libre') return p.rank ?? 999;
  const i = AMBITOS[P.ambito]?.cargos.indexOf(p.cargo);
  return i >= 0 ? i + 1 : (num(p.rank) || 900);
}
function ordered(){
  const arr = P.personas.map((p, idx) => ({...p, _r:rankOf(p), _i:idx})).sort((a, b) => a._r - b._r || a._i - b._i);
  const h = arr.find(x => x.id === P.anfitrion);
  if (!h || P.modoAnf === 'ninguno') return arr;

  if (P.modoAnf === 'preside') return [h, ...rest];
  // cede: preside la autoridad de mayor rango y el anfitrión se sitúa a su derecha
  return [rest[0], h, ...rest.slice(1)].filter(Boolean);
}

const short = (s, n = 18) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function seat(x, y, i, p, labelBelow = true, flag = false){
  const ly = labelBelow ? y + 36 : y - 46;
  return `${flag ? `<line x1="${x}" y1="${y - 40}" x2="${x}" y2="${y + 24}" class="flag"/><rect x="${x}" y="${y - 40}" width="34" height="22" class="seat ${i === 0 ? 'p1' : ''}"/>` : `<circle cx="${x}" cy="${y}" r="19" class="seat ${i === 0 ? 'p1' : ''}"/>`}
    <text x="${flag ? x + 17 : x}" y="${flag ? y - 29 : y}" class="num ${i === 0 ? 'p1n' : ''}">${i + 1}</text>
    <text x="${x}" y="${ly}" class="lbl">${esc(short(p.nombre || p.cargo, 17))}</text>${!flag && p.nombre && p.cargo ? `<text x="${x}" y="${ly + 13}" class="lbl2">${esc(short(p.cargo, 19))}</text>` : ''}`;
}
function svgPresidencial(items, flags){
  const n = items.length, step = 122, W = Math.max(360, n * step + 40), H = 210;
  const pos = new Array(n);
  if (n % 2){ const c = (n - 1) / 2; items.forEach((_, k) => { if (k === 0) pos[k] = c; else { const off = Math.ceil(k / 2); pos[k] = k % 2 ? c - off : c + off; } }); }
  else { const r = n / 2 - 1, l = n / 2; items.forEach((_, k) => { const off = Math.floor(k / 2); pos[k] = k % 2 === 0 ? r - off : l + off; }); }
  // pos = índice visto desde el público (izquierda a derecha); la derecha de la presidencia queda a la izquierda del espectador
  const x0 = (W - (n - 1) * step) / 2; const y = 92;
  let s = `<svg class="seat-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${flags ? 'Orden de banderas' : 'Mesa presidencial'}">`;
  if (!flags) s += `<rect x="20" y="${y - 52}" width="${W - 40}" height="26" rx="4" class="tbl"/><text x="${W / 2}" y="${y - 35}" class="cap">Mesa presidencial</text>`;
  items.forEach((p, k) => s += seat(x0 + pos[k] * step, y, k, p, true, flags));
  s += `<text x="${W / 2}" y="${H - 12}" class="cap">▼ Público ▼  ·  vista desde el público</text>`;
  s += `<text x="26" y="${y - 64}" class="lbl2" style="text-anchor:start">← derecha de la presidencia</text><text x="${W - 26}" y="${y - 64}" class="lbl2" style="text-anchor:end">izquierda de la presidencia →</text>`;
  return s + '</svg>';
}
function svgRedonda(items, enfrentadas){
  const n = items.length, R = Math.max(90, n * 15), Rs = R + 38, W = Rs * 2 + 200, H = Rs * 2 + 120, cx = W / 2, cy = H / 2;
  const step = 360 / n; const ang = new Array(n);
  if (!enfrentadas){ items.forEach((_, k) => { if (k === 0) ang[k] = -90; else { const off = Math.ceil(k / 2); ang[k] = -90 + (k % 2 ? -off : off) * step; } }); }
  else {
    // huecos reales alrededor de la mesa; cada puesto toma el libre más cercano a su lugar ideal
    const slots = Array.from({length:n}, (_, i) => -90 + i * step), used = new Set([0]);
    const take = want => { let best = -1, bd = 1e9; slots.forEach((s, i) => { if (used.has(i)) return; const d = Math.abs(((s - want) % 360 + 540) % 360 - 180); if (d < bd){ bd = d; best = i; } }); used.add(best); return slots[best]; };
    ang[0] = -90; if (n > 1) ang[1] = take(90);
    let a1 = 1, b1 = 1, a2 = 1, b2 = 1;
    for (let k = 2; k < n; k++){ const g = (k - 2) % 4; // 3 dcha del 1, 4 dcha del 2, 5 izda del 1, 6 izda del 2
      ang[k] = take(g === 0 ? -90 - step * a1++ : g === 1 ? ang[1] - step * a2++ : g === 2 ? -90 + step * b1++ : ang[1] + step * b2++); }
  }
  let s = `<svg class="seat-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Mesa redonda"><circle cx="${cx}" cy="${cy}" r="${R}" class="tbl"/><text x="${cx}" y="${cy}" class="cap">Vista cenital</text>`;
  items.forEach((p, k) => { const a = ang[k] * Math.PI / 180, x = cx + Rs * Math.cos(a), y = cy + Rs * Math.sin(a); s += seat(x, y, k, p, Math.sin(a) > -0.3); });
  return s + `<text x="${cx}" y="${H - 6}" class="lbl2">La derecha de cada comensal es la de quien está sentado mirando al centro de la mesa</text></svg>`;
}
function svgBanquete(items, ingles){
  const n = items.length, step = 122;
  const side = ingles ? Math.ceil(Math.max(0, n - 2) / 2) : Math.ceil(n / 2);
  const W = Math.max(420, ingles ? side * step + 260 : (2 * Math.ceil(side / 2) + 1) * step + 80), H = 330, top = 120, bot = 210;
  const x0 = ingles ? 150 : 60 + step / 2;
  let s = `<svg class="seat-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Mesa de banquete"><rect x="${ingles ? 110 : 40}" y="${top + 26}" width="${W - (ingles ? 220 : 80)}" height="${bot - top - 52}" rx="4" class="tbl"/><text x="${W / 2}" y="${(top + bot) / 2 + 4}" class="cap">Vista cenital</text>`;
  const place = (k, x, y, below) => s += seat(x, y, k, items[k], below);
  if (!ingles){
    // lado superior: impares (1,3,5…); el presidente mira hacia abajo, su derecha es la izquierda del dibujo
    const topR = items.map((_, k) => k).filter(k => k % 2 === 0), botR = items.map((_, k) => k).filter(k => k % 2 === 1);
    const off = j => j === 0 ? 0 : (j % 2 ? -Math.ceil(j / 2) : j / 2);
    topR.forEach((k, j) => place(k, W / 2 + off(j) * step, top, false));
    botR.forEach((k, j) => place(k, W / 2 - off(j) * step, bot, true));
  } else {
    place(0, 60, (top + bot) / 2, true); if (n > 1) place(1, W - 60, (top + bot) / 2, true);
    let bl = 0, br = side - 1, tl = 0, tr = side - 1;
    for (let k = 2; k < n; k++){
      const g = (k - 2) % 4; // 3: dcha del 1 (abajo-izq) · 4: dcha del 2 (arriba-dcha) · 5: izda del 1 (arriba-izq) · 6: izda del 2 (abajo-dcha)
      if (g === 0 && bl <= br) place(k, x0 + bl++ * step, bot, true);
      else if (g === 1 && tl <= tr) place(k, x0 + tr-- * step, top, false);
      else if (g === 2 && tl <= tr) place(k, x0 + tl++ * step, top, false);
      else if (bl <= br) place(k, x0 + br-- * step, bot, true);
      else place(k, x0 + tl++ * step, top, false);
    }
  }
  return s + '</svg>';
}

const SMART = [['e','Específico'],['m','Medible'],['a','Alcanzable'],['r','Relevante'],['t','Temporal']];
function newEvaluacion(ev){
  return {id:'', eventoId:ev?.id || '', nombre:ev?.nombre || '', fecha:ev?.fecha || today(), asisPrev:ev?.aforo || '', asisReal:'', presPrev:ev ? (ev.partidas || []).reduce((s, p) => s + num(p.previsto), 0) || '' : '', presReal:ev ? (ev.partidas || []).reduce((s, p) => s + num(p.real), 0) || '' : '', encuestas:'', medios:'', redes:'', incidencias:'', incidenciasTxt:'',
    areas:AREAS.map(a => ({area:a, nota:''})), smart:[{objetivo:ev?.objetivos || '', indicador:'', meta:'', resultado:'', limite:'', e:'', m:'', a:'', r:'', t:''}], fuertes:'', mejoras:''};
}
function calcEval(x){
  const asis = num(x.asisPrev) ? num(x.asisReal) / num(x.asisPrev) * 100 : 0;
  const desv = num(x.presPrev) ? (num(x.presReal) - num(x.presPrev)) / num(x.presPrev) * 100 : 0;
  const notas = (x.areas || []).map(a => num(a.nota)).filter(n => n > 0);
  const sat = notas.length ? notas.reduce((s, n) => s + n, 0) / notas.length : 0;
  const sm = (x.smart || []).filter(o => o.objetivo).map(o => { const crit = SMART.map(([k]) => num(o[k])).filter(n => n > 0); const calidad = crit.length ? crit.reduce((s, n) => s + n, 0) / (5 * 5) * 100 : 0; const cumpl = num(o.meta) ? Math.min(150, num(o.resultado) / num(o.meta) * 100) : 0; return {...o, calidad, cumpl}; });
  const smCumpl = sm.length ? sm.reduce((s, o) => s + Math.min(100, o.cumpl), 0) / sm.length : 0;
  const smCal = sm.length ? sm.reduce((s, o) => s + o.calidad, 0) / sm.length : 0;
  const pAsis = asis ? Math.min(100, asis) : 0;
  const pPres = num(x.presPrev) && num(x.presReal) ? Math.max(0, 100 - Math.max(0, desv) * 2) : 0;
  const parts = [[sat ? sat / 5 * 100 : 0, .35], [smCumpl, .35], [pAsis, .15], [pPres, .15]].filter(([v]) => v > 0);
  const w = parts.reduce((s, [, k]) => s + k, 0);
  const indice = w ? parts.reduce((s, [v, k]) => s + v * k, 0) / w : 0;
  return {asis, desv, sat, sm, smCumpl, smCal, indice, verdict:indice >= 85 ? ['Excelente','ok'] : indice >= 70 ? ['Bueno','ok'] : indice >= 50 ? ['Mejorable','warn'] : indice > 0 ? ['Deficiente','bad'] : ['Sin datos','']};
}
function evalListHTML(){
  const es = [...Store.data.evaluaciones].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  if (!es.length) return `<div class="empty">Aún no hay evaluaciones. Evalúa un acto al terminarlo para saber cómo ha ido.</div>`;
  return es.map(x => { const r = calcEval(x); return `<div class="list-item"><div><div class="t">${esc(x.nombre || 'Acto sin nombre')}</div><div class="small muted">${fdate(x.fecha)} · satisfacción ${r.sat ? r.sat.toFixed(1) + '/5' : '—'} · SMART ${r.sm.length ? pct(r.smCumpl) : '—'}</div></div><div class="row"><span class="pill ${r.verdict[1]}">${r.verdict[0]} · ${pct(r.indice)}</span><button class="small" data-open-eval="${x.id}">Abrir</button></div></div>`; }).join('');
}

/* ============================================================
   IMÁGENES: comprimir lo que sube el usuario para guardarlo con el registro
   ============================================================ */
async function compressImage(file, {max = 600, photo = false} = {}){
  const src = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const sc = Math.min(1, max / Math.max(img.width || max, img.height || max));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round((img.width || max) * sc)); c.height = Math.max(1, Math.round((img.height || max) * sc));
  const ctx = c.getContext('2d');
  if (!photo){ ctx.drawImage(img, 0, 0, c.width, c.height); const u = c.toDataURL('image/png'); if (u.length < 150000) return u; ctx.clearRect(0, 0, c.width, c.height); }
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  let q = .85, u; do { u = c.toDataURL('image/jpeg', q); q -= .1; } while (u.length > 180000 && q > .3);
  return u;
}
function imgSize(src){ return new Promise(r => { const i = new Image(); i.onload = () => r({w:i.naturalWidth || 1, h:i.naturalHeight || 1}); i.onerror = () => r(null); i.src = src; }); }
function imgField(label, key, val){
  return `<div class="img-field"><span class="f-lbl">${esc(label)}</span><div class="row"><div class="img-prev">${val ? `<img src="${val}" alt="Imagen adjunta">` : '<span class="small muted">Sin imagen</span>'}</div>
    <label class="btn">${val ? 'Cambiar' : 'Subir imagen'}<input type="file" accept="image/*" data-img="${key}" hidden></label>${val ? `<button class="ghost small danger" data-img-del="${key}">Quitar</button>` : ''}</div></div>`;
}

/* ============================================================
   EXPORTAR A WORD (.docx) Y PDF
   Modelo de documento: bloques {t:'title'|'h'|'p'|'gap'|'table'|'img'}
   ============================================================ */
const LIBS = {jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', jszip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'};
const _libs = {};
function loadLib(k){
  return _libs[k] ??= new Promise((res, rej) => { const s = document.createElement('script'); s.src = LIBS[k]; s.onload = res; s.onerror = () => { delete _libs[k]; rej(new Error('lib')); }; document.head.append(s); });
}
async function toPDF(blocks, {logo, format = 'a4', center = false, logoMax = 22, font = 'helvetica'} = {}){
  await loadLib('jspdf');
  const doc = new window.jspdf.jsPDF({unit:'mm', format});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = format === 'a4' ? 18 : 14, CW = W - 2 * M;
  let y = M;
  const need = h => { if (y + h > H - M){ doc.addPage(); y = M; } };
  const addImg = async (src, maxH) => { const s = await imgSize(src); if (!s) return; let h = maxH, w = h * s.w / s.h; if (w > CW * .6){ w = CW * .6; h = w * s.h / s.w; } need(h + 4); try { doc.addImage(src, src.startsWith('data:image/png') ? 'PNG' : 'JPEG', center ? (W - w) / 2 : M, y, w, h); y += h + 5; } catch {} };
  if (logo) await addImg(logo, logoMax);
  for (const b of blocks){
    if (b.t === 'gap'){ y += b.h ?? 4; continue; }
    if (b.t === 'img'){ await addImg(b.src, b.h || 30); continue; }
    if (b.t === 'table'){ pdfTable(doc, b, M, CW, () => y, v => y = v, need); y += 4; continue; }
    const st = {title:['bold', 16, 7.5], h:['bold', 11.5, 6]}[b.t] || [b.b ? 'bold' : (b.i ? 'italic' : 'normal'), b.size || 10.5, (b.size || 10.5) * .5];
    doc.setFont(b.font || font, st[0]); doc.setFontSize(b.size || st[1]);
    const lines = doc.splitTextToSize(String(b.text ?? ''), CW);
    if (b.t === 'h'){ need(st[2] * lines.length + 3); y += 2; }
    const al = b.align || (center ? 'center' : 'left');
    lines.forEach(l => { need(st[2]); doc.text(l, al === 'center' ? W / 2 : al === 'right' ? W - M : M, y + (b.size || st[1]) * .3528, {align:al}); y += st[2]; });
    if (b.t === 'title') y += 2;
  }
  const n = doc.getNumberOfPages();
  if (n > 1) for (let i = 1; i <= n; i++){ doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.text(`${i} / ${n}`, W - M, H - 7, {align:'right'}); }
  return doc.output('arraybuffer');
}
function pdfTable(doc, b, M, CW, getY, setY, need){
  const cols = b.head.length, widths = (b.widths || b.head.map(() => 1 / cols)).map(f => f * CW), pad = 1.6, lh = 4.1;
  const bold = new Set(b.boldRows || []);
  const drawRow = (cells, head, isBold) => {
    doc.setFont('helvetica', head || isBold ? 'bold' : 'normal'); doc.setFontSize(9);
    const split = cells.map((c, i) => doc.splitTextToSize(String(c ?? ''), widths[i] - 2 * pad));
    const h = Math.max(...split.map(s => s.length)) * lh + 2 * pad;
    need(h); let x = M; const y = getY();
    split.forEach((lines, i) => {
      doc.setDrawColor(170); doc.setFillColor(232, 234, 240);
      doc.rect(x, y, widths[i], h, head ? 'FD' : 'S');
      const right = (b.align || [])[i] === 'right';
      lines.forEach((l, k) => doc.text(l, right ? x + widths[i] - pad : x + pad, y + pad + 3 + k * lh, {align:right ? 'right' : 'left'}));
      x += widths[i];
    });
    setY(y + h);
  };
  drawRow(b.head, true);
  b.rows.forEach((r, i) => drawRow(r, false, bold.has(i)));
}
async function toDOCX(blocks, {logo, center = false, logoCm = 4, font} = {}){
  await loadLib('jszip');
  const x = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const run = (text, {b, i, size} = {}) => `<w:r><w:rPr>${font ? `<w:rFonts w:ascii="${font}" w:hAnsi="${font}"/>` : ''}${b ? '<w:b/>' : ''}${i ? '<w:i/>' : ''}${size ? `<w:sz w:val="${Math.round(size * 2)}"/>` : ''}</w:rPr><w:t xml:space="preserve">${x(text)}</w:t></w:r>`;
  const para = (inner, {align, after = 120} = {}) => `<w:p><w:pPr><w:spacing w:after="${after}"/>${align && align !== 'left' ? `<w:jc w:val="${align === 'center' ? 'center' : 'right'}"/>` : ''}</w:pPr>${inner}</w:p>`;
  const media = []; let rid = 10;
  const imgRun = async (src, maxCm, maxHcm = 2.6) => {
    const s = await imgSize(src); if (!s) return '';

function packCalc(p, cfg){
  const n = num(cfg.n);
  const bruto = p.fijo + p.pp * n;
  // Servicios del pack que el cliente no quiere: se descuentan (por defecto, la parte proporcional del pack).
  const share = bruto / Math.max(1, p.incluye.length);
  const quitados = (cfg.incluye || []).filter(i => !i.on).map(i => ({nombre:i.t, imp:-(i.desc === '' || i.desc == null ? Math.round(share) : num(i.desc))}));
  const base = bruto + quitados.reduce((s, q) => s + q.imp, 0);
  const ex = p.extras.map((e, i) => ({nombre:e[0], precio:e[1], unidad:e[2], on:!!cfg.extras[i]})).filter(e => e.on).map(e => ({...e, imp:e.unidad === 'persona' ? e.precio * n : e.precio}));
  const cu = (cfg.custom || []).filter(c => c.nombre).map(c => ({nombre:c.nombre, precio:num(c.precio), unidad:c.unidad || 'fijo', imp:(c.unidad === 'persona' ? n : 1) * num(c.precio)}));
  const sub = base + [...ex, ...cu].reduce((s, e) => s + e.imp, 0), iva = sub * .21;
  return {n, bruto, share, quitados, base, ex, cu, sub, iva, total:sub + iva};
}

    const name = slug('convocatoria-' + (c.organo || '') + '-' + (c.fecha || ''));

    }
  };
}

function provFiltrados(){
  const f = UI.prov, n = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''), q = n(f.q);
