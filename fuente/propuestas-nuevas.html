<title>Interfaz más moderna</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Página contenedora neutra; cada maqueta lleva su propia paleta fija porque es una muestra visual, no sigue el tema. */
:root{--bg:#eef0f3;--fg:#1b1f27;--muted:#5d6472;--line:#d5d9e0;--card:#ffffff;--accent:#1b1f27}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181e;--fg:#e9ebef;--muted:#9aa1ad;--line:#2b3039;--card:#1d2129;--accent:#e9ebef;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181e;--fg:#e9ebef;--muted:#9aa1ad;--line:#2b3039;--card:#1d2129;--accent:#e9ebef;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,sans-serif;margin:0}
.page{max-width:1240px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.page h1{font-family:"Instrument Sans",system-ui,sans-serif;font-size:2.1rem;margin:0;text-wrap:balance;letter-spacing:-.02em}
.page .lede{color:var(--muted);max-width:72ch;margin:6px 0 0;line-height:1.55}
.switch{display:flex;gap:8px;flex-wrap:wrap}
.switch button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:200px;flex:1}
.switch button small{font-weight:400;color:var(--muted)}
.switch button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.switch button:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
.frame{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 18px 50px rgba(0,0,0,.12)}
.frame-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.frame-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.frame-bar span{margin-left:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame-body{container-type:inline-size}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.note h3{margin:0 0 6px;font-size:1rem}
.note p{color:var(--muted);font-size:.88rem;line-height:1.5;margin:0}
@media (max-width:800px){.notes{grid-template-columns:minmax(0,1fr)}}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.img svg,.img{display:block;width:100%;height:100%}
.mock button{font:inherit;cursor:pointer}

/* ========== H · ESTUDIO ========== */
.mH{--ink:#1a1c1c;--mut:#6b706e;--line:#e6e5e1;--bg:#fafaf8;--acc:#2f5d5a;background:var(--bg);color:var(--ink);font-family:"Geist",system-ui,sans-serif;display:grid;grid-template-columns:216px minmax(0,1fr);font-size:.875rem;line-height:1.4}
.mH .num{font-family:"Geist Mono",monospace;font-variant-numeric:tabular-nums}
.mH aside{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:1px}
.mH .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 12px;font-weight:600}
.mH .brand i{width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fafaf8;display:grid;place-items:center;font:600 .62rem "Geist Mono",monospace}
.mH .find{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--mut);font-size:.8rem}
.mH .find kbd{margin-left:auto;font:500 .68rem "Geist Mono",monospace}
.mH .find svg.ic,.mH aside a svg.ic{width:15px;height:15px}
.mH aside .gr{padding:12px 8px 3px;font-size:.7rem;color:var(--mut)}
.mH aside a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:#3c403f;text-decoration:none}
.mH aside a.on{background:#eeeeea;color:var(--ink);font-weight:500}
.mH aside .usr{margin-top:auto;padding:10px 8px 2px;font-size:.8rem;color:var(--mut)}
.mH main{padding:22px 28px 30px;min-width:0;display:flex;flex-direction:column;gap:18px}
.mH .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mH .hd h2{margin:0;font-size:1.3rem;font-weight:600;letter-spacing:-.015em}
.mH .hd p{margin:1px 0 0;color:var(--mut);font-size:.82rem}
.mH .hd div:first-child{margin-right:auto}
.mH .b{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:7px 12px;font-weight:500;font-size:.82rem}
.mH .b.p{background:var(--ink);border-color:var(--ink);color:#fafaf8}
.mH .met{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:#fff}
.mH .met div{padding:13px 16px;border-left:1px solid var(--line);min-width:0}
.mH .met div:first-child{border-left:0}
.mH .met span{display:block;color:var(--mut);font-size:.76rem}
.mH .met b{display:block;font-family:"Geist Mono",monospace;font-weight:500;font-size:1.45rem;letter-spacing:-.03em;margin:3px 0 1px}
.mH .met small{color:var(--mut);font-size:.72rem}
.mH .card{border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0}
.mH .ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:.84rem}
.mH .ct small{font-weight:400;color:var(--mut)}
.mH .tl{padding:38px 16px 10px;position:relative}
.mH .axis{position:relative;height:30px;border-top:1px solid #cfcec9}
.mH .axis u{position:absolute;top:-1px;width:1px;height:6px;background:#cfcec9;text-decoration:none}
.mH .axis em{position:absolute;top:9px;transform:translateX(-50%);font:400 .68rem "Geist Mono",monospace;color:var(--mut)}
.mH .axis em:first-of-type{transform:none}
.mH .mk{position:absolute;bottom:100%;margin-bottom:-5px;transform:translateX(-5px);display:flex;flex-direction:column-reverse;align-items:flex-start;gap:6px;white-space:nowrap;font-size:.76rem;font-weight:500}
.mH .mk::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px #fff}
.mH .mk.sq::before{border-radius:2px;background:var(--ink)}
.mH .two{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;align-items:start}
.mH .rw{display:grid;grid-template-columns:44px minmax(0,1fr) 62px 104px 118px;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid #f0efec}
.mH .rw:first-of-type{border-top:0}
.mH .rw .th{width:44px;height:32px;border-radius:5px;overflow:hidden;filter:saturate(.45)}
.mH .rw b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mH .rw .sub{display:block;color:var(--mut);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mH .st{display:flex;align-items:center;gap:6px;color:#3c403f;font-size:.78rem}
.mH .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.mH .pr{display:flex;align-items:center;gap:8px;font:400 .72rem "Geist Mono",monospace;color:var(--mut)}
.mH .pr i{flex:1;height:3px;border-radius:2px;background:#ececE8;overflow:hidden;display:block}
.mH .pr i::after{content:"";display:block;height:100%;width:var(--p);background:var(--ink)}
.mH .tk{display:flex;gap:9px;align-items:center;padding:8px 16px;border-top:1px solid #f0efec;font-size:.82rem}
.mH .tk:first-of-type{border-top:0}
.mH .tk i{width:14px;height:14px;flex:none;border:1px solid #bdbcb6;border-radius:4px}
.mH .tk small{margin-left:auto;color:var(--mut);font:400 .72rem "Geist Mono",monospace;white-space:nowrap}
.mH .tabbar{display:none}
@container (max-width:1100px){.mH .two{grid-template-columns:minmax(0,1fr)}}
@container (max-width:760px){
  .mH{grid-template-columns:minmax(0,1fr)}
  .mH aside{display:none}
  .mH main{padding:16px 14px}
  .mH .met{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mH .met div:nth-child(3){border-left:0}
  .mH .met div:nth-child(n+3){border-top:1px solid var(--line)}
  .mH .two{grid-template-columns:minmax(0,1fr)}
  .mH .rw{grid-template-columns:44px minmax(0,1fr) 54px}
  .mH .rw .st,.mH .rw .pr{display:none}
  .mH .hide-s{display:none}
  .mH .tabbar{display:flex;border-top:1px solid var(--line);background:#fff;justify-content:space-around;padding:8px 4px}
  .mH .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:.66rem;text-decoration:none}
  .mH .tabbar a.on{color:var(--ink);font-weight:600}
}

/* ========== I · SERENO CONTEMPORÁNEO ========== */
.mI{--ink:#191b1a;--mut:#6d716e;--bg:#ecebe6;--tile:#fbfaf7;--dark:#1f2523;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;padding:14px 22px 26px}
.mI .bar{display:flex;align-items:center;gap:22px;background:var(--tile);border-radius:14px;padding:9px 10px 9px 18px}
.mI .logo{font-weight:600;letter-spacing:-.02em;font-size:1.02rem}
.mI .bar nav{display:flex;gap:18px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.mI .bar nav a{color:var(--mut);text-decoration:none;font-size:.86rem;font-weight:500;white-space:nowrap}
.mI .bar nav a.on{color:var(--ink);font-weight:600}
.mI .av{width:32px;height:32px;flex:none;border-radius:10px;background:var(--dark);color:#f4f2ec;display:grid;place-items:center;font-weight:600;font-size:.74rem}
.mI .hl{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:34px 6px 20px}
.mI .hl h2{margin:0;font-size:3.5rem;font-weight:500;letter-spacing:-.045em;line-height:1}
.mI .hl p{margin:10px 0 0;color:var(--mut);font-size:1rem}
.mI .go{border:0;border-radius:12px;background:var(--dark);color:#f4f2ec;font-weight:600;font-size:.88rem;padding:12px 18px}
.mI .gr{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.mI .t{background:var(--tile);border-radius:20px;padding:18px;min-width:0;position:relative;overflow:hidden}
.mI .lb{font-size:.82rem;color:var(--mut);font-weight:500}
.mI .fe{grid-column:span 7;min-height:326px;background:var(--dark);color:#f4f2ec;display:flex;flex-direction:column;justify-content:space-between;padding:24px}
.mI .fe .im{position:absolute;inset:0 0 0 34%;filter:saturate(.35) brightness(.9)}
.mI .fe .im svg{display:block;width:100%;height:100%}
.mI .fe::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#1f2523 34%,#1f252300 78%)}
.mI .fe > div{position:relative;z-index:1}
.mI .fe > .im{position:absolute;z-index:0}
.mI .fe .lb{color:#b9bdb8}
.mI .dd{font-size:6.2rem;font-weight:500;letter-spacing:-.06em;line-height:.9;margin-top:10px}
.mI .dd small{font-size:1.1rem;letter-spacing:-.01em;margin-left:8px;color:#b9bdb8}
.mI .fe h3{margin:0;font-size:1.45rem;font-weight:500;letter-spacing:-.025em;max-width:20ch;line-height:1.15}
.mI .fe p{margin:6px 0 12px;color:#b9bdb8;font-size:.86rem}
.mI .ln{height:3px;max-width:260px;border-radius:2px;background:#ffffff2e}
.mI .ln i{display:block;height:100%;background:#f4f2ec;border-radius:2px}
.mI .kp{grid-column:span 5;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mI .kp .t{display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.mI .kp b{font-size:3.1rem;font-weight:400;letter-spacing:-.05em;line-height:1}
.mI .kp b.m{font-size:2.3rem}
.mI .rn{grid-column:span 4;display:flex;flex-direction:column;gap:10px}
.mI .rn h3{margin:0;font-size:1.3rem;font-weight:500;letter-spacing:-.025em;line-height:1.15}
.mI .rn ol{margin:auto 0 0;padding:0;list-style:none;font-size:.84rem;color:var(--mut)}
.mI .rn li{padding:7px 0;border-top:1px solid #e7e5de}
.mI .ac{grid-column:span 8}
.mI .ac .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.mI .ac .im{height:128px;border-radius:12px;overflow:hidden;filter:saturate(.45)}
.mI .ac b{display:block;margin-top:9px;font-size:.92rem;font-weight:600;letter-spacing:-.01em}
.mI .ac span{font-size:.8rem;color:var(--mut)}
.mI .ql{display:flex;flex-wrap:wrap;gap:6px 26px;padding:18px 6px 0;font-size:.9rem;font-weight:500}
.mI .ql a{color:var(--ink);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.mI .ql svg.ic{width:13px;height:13px;color:var(--mut)}
@container (max-width:760px){
  .mI{padding:10px 12px 20px}
  .mI .bar nav{display:none}.mI .bar{justify-content:space-between}
  .mI .hl{padding:24px 4px 16px}.mI .hl h2{font-size:2.5rem}
  .mI .fe,.mI .kp,.mI .rn,.mI .ac{grid-column:1/-1}
  .mI .fe .im{inset:0 0 0 20%}
  .mI .fe::after{background:linear-gradient(0deg,#1f2523 42%,#1f252300 88%),linear-gradient(90deg,#1f2523 22%,#1f252300 70%)}
  .mI .ac .row{grid-template-columns:minmax(0,1fr)}
  .mI .ac .im{height:150px}
}

/* ========== G · BENTO SERENO (A + E) ========== */
.mG{background:#f5f3ee;color:#24302f;font-family:"Manrope",sans-serif;padding:20px 24px 26px}
.mG .top{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.mG .logo{font-family:"Fraunces",serif;font-weight:600;font-size:1.3rem;color:#3f6266}
.mG nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.mG nav a{padding:8px 14px;border-radius:999px;font-weight:600;font-size:.85rem;color:#66706e;text-decoration:none;white-space:nowrap}
.mG nav a.on{background:#3f6266;color:#fff}
.mG .av{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#e6dccb;color:#5c4a33;display:grid;place-items:center;font-weight:800;font-size:.84rem}
.mG .bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:14px;grid-template-areas:"hero hero next next" "hero hero task succ" "bud bud prov conv" "quick quick quick conv"}
.mG .t{border-radius:26px;padding:20px;position:relative;overflow:hidden;min-width:0;background:#fff;border:1px solid #e8e3d9}
.mG .num{font-family:"Fraunces",serif;font-weight:500;letter-spacing:-.02em;line-height:1}
.mG .lbl{font-weight:600;font-size:.84rem;color:#66706e}
.mG .hero{grid-area:hero;background:linear-gradient(150deg,#4b6e71 0%,#5f8483 60%,#7a9a96 100%);border:0;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:28px 28px 54px}
.mG .hero .eb{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.mG .hero h2{margin:8px 0 0;font-family:"Fraunces",serif;font-weight:500;font-size:2.6rem;line-height:1.05;max-width:12ch}
.mG .hero p{margin:12px 0 0;font-size:.93rem;opacity:.88;max-width:36ch;line-height:1.5}
.mG .hero .b{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
.mG .pill{border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:.85rem;background:#f1e6d2;color:#3a3226}
.mG .pill.o{background:#ffffff1f;color:#fff;box-shadow:inset 0 0 0 1px #ffffff55}
.mG .wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:42px}
.mG .next{grid-area:next;padding:0;border:0;color:#fff}
.mG .next .img{position:absolute;inset:0;filter:saturate(.7)}
.mG .next .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,36,36,.72),rgba(28,36,36,.05) 75%);padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.mG .date{display:inline-block;background:#fff;color:#3f6266;border-radius:14px;padding:6px 12px;text-align:center;font-family:"Fraunces";font-size:1.5rem;font-weight:600;line-height:1;align-self:flex-start}
.mG .date small{display:block;font-family:"Manrope";font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#7a8583;margin-top:3px}
.mG .next b{font-size:1.05rem;max-width:24ch;display:block}
.mG .next span{font-size:.8rem;opacity:.85}
.mG .next .bar{height:5px;border-radius:9px;background:#ffffff33;overflow:hidden;margin-top:8px;max-width:240px}
.mG .next .bar i{display:block;height:100%;background:#f1e6d2}
.mG .task{grid-area:task;background:#ece6da;border-color:#e2dbcc}
.mG .task .num{font-size:3.8rem;color:#5c4a33}
.mG .arrow{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;background:#fff;color:#5c4a33;display:grid;place-items:center}
.mG .succ{grid-area:succ;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.mG .succ svg{width:84px;height:84px}
.mG .bud{grid-area:bud;background:#e3ebe8;border-color:#d6e1dd;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.mG .bud .num{font-size:2.4rem;color:#2f4f52}
.mG .stack{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:3px}
.mG .stack i{display:block;height:100%}
.mG .leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;font-weight:600;color:#55605e;margin-top:8px}
.mG .leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.mG .prov{grid-area:prov}
.mG .prov .num{font-size:2.8rem;color:#3f6266}
.mG .avs{display:flex;margin-top:12px}
.mG .avs span{width:30px;height:30px;border-radius:50%;border:3px solid #fff;margin-right:-8px;display:grid;place-items:center;font-size:.6rem;font-weight:800}
.mG .conv{grid-area:conv;background:#efe9df;border-color:#e4dccd;display:flex;flex-direction:column;gap:10px}
.mG .cal{background:#fff;border-radius:16px;text-align:center;padding:0 0 10px;width:88px;overflow:hidden;border:1px solid #e4dccd}
.mG .cal small{display:block;background:#b48a6e;color:#fff;font-weight:800;font-size:.68rem;letter-spacing:.1em;padding:4px 0;margin-bottom:6px}
.mG .cal .num{font-size:2.2rem;color:#5c4a33}
.mG .conv b{font-size:.92rem}
.mG .conv ol{margin:0;padding-left:18px;font-size:.8rem;line-height:1.55;color:#55605e}
.mG .ok{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;background:#dfe9e3;color:#2f6b4f;border-radius:999px;padding:5px 11px;align-self:flex-start}
.mG .quick{grid-area:quick;display:flex;align-items:center;gap:8px;flex-wrap:wrap;align-content:center}
.mG .quick h3{width:100%;margin:0 0 4px;font-family:"Fraunces";font-weight:500;font-size:1.2rem}
.mG .q{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:#f5f3ee;font-weight:600;font-size:.83rem;border:1px solid #ebe6dc;color:#24302f}
.mG .q span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.mG .q svg.ic{width:15px;height:15px}
@container (max-width:760px){
  .mG{padding:14px}
  .mG .bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(140px,auto);grid-template-areas:"hero hero" "hero hero" "next next" "task succ" "bud bud" "prov conv" "quick quick"}
  .mG .hero h2{font-size:2.1rem}
}

const stage = document.getElementById('stage'), notes = document.getElementById('notes'), url = document.getElementById('url');
function show(k){
  stage.innerHTML = M[k].html();
  notes.innerHTML = M[k].notas.map(([t, p]) => `<div class="note"><h3>${t}</h3><p>${p}</p></div>`).join('');
  url.textContent = `gabinete-protocolo.vercel.app · Propuesta ${k} · ${M[k].titulo}`;
  document.querySelectorAll('[data-m]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === k)));
  try { localStorage.setItem('propuesta2', k); } catch {}
}
document.querySelector('.switch').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) show(b.dataset.m); });
